services:
  - type: web
    name: provecheck-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: STORAGE_BUCKET
        value: provecheck
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      # Secrets: Render asks for these four when the Blueprint is created (never put them in this file).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Filled in later from the Render dashboard (Environment tab):
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: MAIL_FROM
        value: ""
      # Comma separated origins of the panel and the web app, e.g. https://panel.example.com,https://app.example.com
      - key: CORS_ORIGINS
        value: ""
      - key: APP_URL
        value: ""
